name: api-gateway

on:
  push:
    branches: [main]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_java.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    uses: ./.github/workflows/_java.yml
    with:
      servicio: api-gateway
