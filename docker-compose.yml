# Samaria360 - Prototipo arquitectónico ejecutable (fase de Elaboración, RUP)
# Etapa 1: solo infraestructura de datos, para programar ms-auth y ms-catalog contra bases reales.
# Los servicios (api-gateway, ms-auth, ms-catalog, ms-chatbot, frontend) se agregan
# a este mismo archivo a medida que cada uno tenga su Dockerfile.

services:
  postgres:
    image: postgres:16-alpine
    container_name: samaria360-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea auth_db y reservas_db en el primer arranque (volumen vacío)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: samaria360-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: catalog_db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      # Validadores $jsonSchema, índices (2dsphere) y semilla del catálogo
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
