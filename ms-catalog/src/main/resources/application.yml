server:
  port: 8082

spring:
  application:
    name: ms-catalog
  config:
    # .env de la raíz del monorepo (ms-catalog se ejecuta desde su propia carpeta)
    import: optional:file:../.env[.properties]
  profiles:
    default: dev
  data:
    mongodb:
      # El usuario raíz de docker-compose se crea en la base admin: authSource=admin.
      # Si la contraseña tiene caracteres especiales (@ : / ? # %), debe ir codificada para URL en .env.
      # MONGO_HOST: localhost con ./mvnw; "mongo" dentro de Docker Compose.
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/catalog_db?authSource=admin
      # Explícito: en pruebas, la conexión de Testcontainers apunta a otra base por defecto.
      database: catalog_db

samaria360:
  seguridad:
    # JWKS de ms-auth para validar los JWT de los endpoints protegidos (la búsqueda es pública).
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
    emisor: samaria360-auth

# Swagger solo en dev (ver documento de perfil dev más abajo)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
