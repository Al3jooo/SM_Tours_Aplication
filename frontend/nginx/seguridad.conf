# Encabezados de seguridad de todas las respuestas (incluidas las de /api/). "always" hace que lleguen también en las
# respuestas de error (4xx y 5xx, p. ej. el 503 de @gateway_no_disponible); sin él, nginx solo los agrega a 2xx y 3xx.
add_header X-Content-Type-Options "nosniff" always;
# Las teselas de OpenStreetMap exigen un Referer válido (política de uso): no usar no-referrer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 'unsafe-inline' en estilos: Leaflet posiciona el mapa, las teselas y los marcadores con estilos en línea.
# img-src incluye las teselas de OSM, el único recurso externo permitido (CLAUDE.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
