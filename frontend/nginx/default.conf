# Sirve la SPA y pasa /api/ al API Gateway: el navegador habla con un solo origen, como con el proxy de Vite en
# desarrollo. El gateway sigue siendo el único punto de entrada a los servicios (ADR-005).

# "instance" del ProblemDetail de @gateway_no_disponible. nginx no escapa variables para JSON: la ruta se usa solo si
# no tiene comillas, barras invertidas ni caracteres de control.
map $uri $instancia_problema {
    "~[\x00-\x1f\"\\\\]"  /api;
    default             $uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Encabezados de seguridad. nginx no hereda los add_header del server en un location que define los suyos,
    # por eso el mismo include se repite en cada location con Cache-Control.
    include /etc/nginx/samaria360/seguridad.conf;

    # DNS interno de Docker: el nombre se resuelve en cada petición, así nginx arranca aunque el gateway
    # todavía no exista y sigue funcionando si el contenedor del gateway se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    location /api/ {
        # Sin URI en proxy_pass: la ruta llega sin reescribir (/api/v1/...).
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring Security ya envía este encabezado; nginx lo agrega para todas las respuestas (seguridad.conf).
        proxy_hide_header X-Content-Type-Options;

        # Si nginx no logra hablar con el gateway (arrancando, detenido o sin responder), responde un 503 con el
        # mismo ProblemDetail que el gateway. proxy_intercept_errors sigue desactivado: las respuestas del gateway,
        # incluido su propio 503 (p. ej. servicio: ms-catalog), pasan sin cambios.
        error_page 502 504 = @gateway_no_disponible;
    }

    location @gateway_no_disponible {
        include /etc/nginx/samaria360/seguridad.conf;
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"El servicio api-gateway no está disponible en este momento","instance":"$instancia_problema","codigo":"SERVICIO_NO_DISPONIBLE","servicio":"api-gateway"}';
    }

    # Archivos con hash en el nombre: nunca cambian. Si uno no existe, 404 (no index.html).
    location /assets/ {
        include /etc/nginx/samaria360/seguridad.conf;
        # Sin "always": un 404 (archivo que ya no existe) no debe quedar en caché un año.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html siempre se revalida: después de publicar una versión nueva apunta a los archivos nuevos.
    location = /index.html {
        include /etc/nginx/samaria360/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de la SPA (/explorar, /login…): al recargar se sirve index.html.
    location / {
        include /etc/nginx/samaria360/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
